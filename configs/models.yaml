models:
  hash:
    adapter: hash
    model_id: hash
    revision: "0"
    dimension: 64
    seed: 0
  e5-base-v2:
    adapter: e5
    model_id: intfloat/e5-base-v2
    revision: openrouter-api
    dimension: 768
    batch_size: 32
    provider:
      type: openrouter
      api_key_env: OPENROUTER_API_KEY
      base_url: https://openrouter.ai/api/v1
