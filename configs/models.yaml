models:
  text-embedding-3-small-aiberm:
    adapter: text-embedding-3-small
    model_id: openai/text-embedding-3-small
    revision: aiberm-api
    dimension: 1536
    batch_size: 32
    empty_text_placeholder: "[EMPTY]"
    provider:
      type: aiberm
      base_url: https://aiberm.com/v1
      api_key_env: AIBERM_API_KEY
      timeout_seconds: 120
      max_retries: 5
  e5-base-v2-openrouter:
    adapter: e5
    model_id: intfloat/e5-base-v2
    revision: openrouter-api
    dimension: 768
    batch_size: 32
    empty_text_placeholder: "[EMPTY]"
    provider:
      type: openrouter
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      timeout_seconds: 120
      max_retries: 5
      encoding_format: float
  bge-m3:
    adapter: bge-m3
    model_id: BAAI/bge-m3
    revision: siliconflow-api
    dimension: 1024
    batch_size: 32
    empty_text_placeholder: "[EMPTY]"
    provider:
      type: siliconflow
      base_url: https://api.siliconflow.cn/v1
      api_key_env: SILICONFLOW_API_KEY
      timeout_seconds: 120
      max_retries: 5
      encoding_format: float
  e5-large-v2:
    adapter: e5
    model_id: intfloat/e5-large-v2
    revision: main
    batch_size: 32
  qwen3-embedding-0.6b:
    adapter: qwen3
    model_id: Qwen/Qwen3-Embedding-0.6B
    revision: siliconflow-api
    dimension: 1024
    batch_size: 32
    empty_text_placeholder: "[EMPTY]"
    query_instruction: "Given a web search query, retrieve relevant passages that answer the query"
    provider:
      type: siliconflow
      base_url: https://api.siliconflow.cn/v1
      api_key_env: SILICONFLOW_API_KEY
      timeout_seconds: 120
      max_retries: 5
      encoding_format: float
  gte-modernbert-base:
    adapter: gte
    model_id: Alibaba-NLP/gte-modernbert-base
    revision: main
    batch_size: 32
