dataset:
  name: arguana
  root: datasets
  split: test
  download: false
  missing_relevant_policy: keep

model:
  adapter: e5
  model_id: intfloat/e5-base-v2
  revision: openrouter-api
  dimension: 768
  batch_size: 32
  provider:
    type: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_seconds: 120
    max_retries: 5
    encoding_format: float

cache_dir: cache
results_dir: results
search_k: 100
temperature: 1.0
oracle_lambdas: [0, 0.01, 0.02, 0.05, 0.10, 0.20]
